<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Data</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100 p-4 md:p-8">
    <div class="container mx-auto max-w-5xl">
      <!-- Section 1: Add Employee Form (NEWLY ADDED) -->
      <div class="bg-gray-200 p-6 rounded-lg shadow-md mb-8">
        <h2 class="text-2xl font-bold mb-4 text-gray-800">Add New Employee</h2>
        <form
          id="add-employee-form"
          class="grid grid-cols-1 md:grid-cols-4 gap-4"
        >
          <div>
            <label
              for="name-input"
              class="block text-sm font-medium text-gray-700"
              >Name</label
            >
            <input
              type="text"
              id="name-input"
              required
              class="bg-gray-50 mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500"
            />
          </div>
          <div>
            <label
              for="position-input"
              class="block text-sm font-medium text-gray-700"
              >Position</label
            >
            <input
              type="text"
              id="position-input"
              required
              class="bg-gray-50 mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500"
            />
          </div>
          <div>
            <label
              for="department-input"
              class="block text-sm font-medium text-gray-700"
              >Department</label
            >
            <input
              type="text"
              id="department-input"
              required
              class="bg-gray-50 mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500"
            />
          </div>
          <div class="flex items-end">
            <button
              type="submit"
              class="w-full bg-blue-500 text-white py-2 px-4 rounded-md shadow-sm hover:bg-blue-600 font-medium"
            >
              Add Employee
            </button>
          </div>
        </form>
      </div>

      <!-- Section 2: Employee Data Table -->
      <h1 class="text-3xl font-bold mb-6 text-center text-gray-800">
        Employee Roster
      </h1>
      <div class="bg-white shadow-md rounded-lg overflow-x-auto">
        <table class="table-auto w-full min-w-full border-collapse">
          <thead class="bg-gray-200 text-left">
            <tr>
              <th
                class="border px-4 py-3 text-xs font-semibold text-gray-600 uppercase text-center w-[8%]"
              >
                ID
              </th>
              <th
                class="border px-4 py-3 text-xs font-semibold text-gray-600 uppercase w-[28%]"
              >
                Name
              </th>
              <th
                class="border px-4 py-3 text-xs font-semibold text-gray-600 uppercase w-[24%]"
              >
                Position
              </th>
              <th
                class="border px-4 py-3 text-xs font-semibold text-gray-600 uppercase w-[24%]"
              >
                Department
              </th>
              <th
                class="border px-4 py-3 text-xs font-semibold text-gray-600 uppercase text-center w-[16%]"
              >
                Actions
              </th>
            </tr>
          </thead>
          <tbody
            id="employeeTableBody"
            class="bg-gray-50 divide-y divide-gray-200"
          >
            <!-- Dynamic JavaScript Rows will be injected here -->
          </tbody>
        </table>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
